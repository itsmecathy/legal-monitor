name: Legal monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths-ignore: ['docs/news.json']
concurrency:
  group: legal-monitor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      result: ${{ steps.collect.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - id: collect
        run: |
          set +e
          python collect.py
          code=$?
          echo "result=$code" >> "$GITHUB_OUTPUT"
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/news.json
          git diff --cached --quiet || (git commit -m 'Update news' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - if: needs.collect.outputs.result != '0'
        run: exit 1
