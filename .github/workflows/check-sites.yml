
name: Check government websites

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Treasury SSL
        run: |
          curl -4 -k -L -sS \
            --connect-timeout 30 \
            --max-time 60 \
            -o /dev/null \
            -w "Treasury HTTP: %{http_code}\n" \
            "https://roskazna.gov.ru/" || true

      - name: Check news and RSS
        run: |
          for url in \
            "https://minfin.gov.ru/ru/press-center/" \
            "https://roszdravnadzor.gov.ru/rss/" \
            "https://roszdravnadzor.gov.ru/news" \
            "https://regulation.gov.ru/" \
            "https://max.ru/gis_eiszakupki"
          do
            echo "============================"
            echo "Checking: $url"

            curl -4 -L -sS \
              --connect-timeout 30 \
              --max-time 60 \
              --retry 1 \
              -A "LegalMonitor/1.0" \
              -o /tmp/response.txt \
              -w "HTTP: %{http_code}\nType: %{content_type}\nSize: %{size_download}\n" \
              "$url" && head -c 2000 /tmp/response.txt

            echo ""
          done

