
name: Check MAX channels

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check MAX publications
        run: |
          python -u - <<'PY'
          import requests
          import re
          import time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlsplit

          url = "https://max.ru/gis_eiszakupki"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "LegalMonitor/2.0",
              "Accept-Language": "ru-RU,ru;q=0.9"
          })

          r = session.get(url, timeout=(30, 60))
          r.raise_for_status()

          soup = BeautifulSoup(r.content, "html.parser")

          print("HTTP:", r.status_code)
          print("Page size:", len(r.content))

          posts = {}

          for a in soup.select("a[href]"):
              link = urljoin(url, a["href"])
              p = urlsplit(link)

              if p.netloc == "max.ru" and re.fullmatch(
                  r"/gis_eiszakupki/[^/]+/?", p.path
              ):
                  posts[link] = a.get_text(" ", strip=True)

          print("POSTS FOUND:", len(posts))

          for link, title in list(posts.items())[:10]:
              print("\n" + "=" * 50)
              print("TITLE:", title)
              print("URL:", link)

              try:
                  time.sleep(2)

                  response = session.get(
                      link, timeout=(30, 60)
                  )

                  response.raise_for_status()

                  page = BeautifulSoup(
                      response.content,
                      "html.parser"
                  )

                  for tag in page.select(
                      "script, style, noscript"
                  ):
                      tag.decompose()

                  print("DATE ELEMENTS:")

                  for tag in page.select("time"):
                      print(
                          tag.get("datetime"),
                          tag.get_text(" ", strip=True)
                      )

                  print("POST CONTENT:")
                  print(page.get_text("\n", strip=True)[:4000])

              except Exception as e:
                  print("ERROR:", str(e))

          PY
