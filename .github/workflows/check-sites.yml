
name: Check government websites

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Update certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates

      - name: Advanced website check
        run: |
          for url in \
            "https://fas.gov.ru/" \
            "https://minfin.gov.ru/" \
            "https://roskazna.gov.ru/" \
            "https://ach.gov.ru/" \
            "https://minpromtorg.gov.ru/" \
            "https://roszdravnadzor.gov.ru/" \
            "https://publication.pravo.gov.ru/" \
            "https://regulation.gov.ru/" \
            "https://zakupki.gov.ru/epz/main/public/news/news-search.html"
          do
            echo "================================"
            echo "Checking: $url"

            curl -4 -L -sS \
              --connect-timeout 30 \
              --max-time 60 \
              --retry 1 \
              --retry-delay 5 \
              -A "LegalMonitor/1.0" \
              -H "Accept-Language: ru-RU,ru;q=0.9" \
              -o /dev/null \
              -w "HTTP: %{http_code}\nIP: %{remote_ip}\nTime: %{time_total}s\n" \
              "$url" || echo "Connection failed"
          done
