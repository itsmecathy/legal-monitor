
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Мониторинг госзакупок</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js?v=6"></script>
</head>
<body>

<header>
  <div class="wrap">
    <small>МОНИТОРИНГ • 44-ФЗ · 223-ФЗ</small>
    <h1>Мониторинг госзакупок</h1>
    <p>Изменения законодательства, разъяснения и практика закупок</p>
  </div>
</header>

<main class="wrap">

  <p id="status" role="status">Загрузка…</p>

  <section class="filters">

<label>Платформа
  <select id="platform">
    <option value="">Все платформы</option>
    <option value="telegram">Telegram</option>
    <option value="max">MAX</option>
    <option value="vk">ВКонтакте</option>
    <option value="web">Сайты и RSS</option>
  </select>
</label>

    <label>Дата с
      <input type="date" id="dateFrom">
    </label>

    <label>Дата по
      <input type="date" id="dateTo">
    </label>

    <button type="button" id="resetDates">
      Сбросить даты
    </button>

    <label>Поиск
      <input id="q" placeholder="Закон, тема, источник">
    </label>

    <label>Закон
      <select id="law">
        <option value="">Все законы</option>
        <option>44-ФЗ</option>
        <option>223-ФЗ</option>
        <option>Общие закупочные вопросы</option>
      </select>
    </label>

    <label>Тема
      <select id="topic">
        <option value="">Все темы</option>
      </select>
    </label>

    <label>Тип новости
      <select id="news_type">
        <option value="">Все типы</option>
      </select>
    </label>

    <label>Тип источника
      <select id="kind">
        <option value="">Все источники</option>
      </select>
    </label>

  </section>

  <p id="count"></p>

  <div id="items"></div>

  <button type="button" id="more" hidden>
    Показать ещё
  </button>

  <details>
    <summary>Состояние источников</summary>
    <ul id="health"></ul>
  </details>

  <footer>
    Автоматическая подборка, не юридическое заключение.
    Статус актов проверяйте по
    <a href="https://publication.pravo.gov.ru/"
       target="_blank"
       rel="noopener noreferrer">
      официальному опубликованию
    </a>.
  </footer>

</main>
</body>
</html>
